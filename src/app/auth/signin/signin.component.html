<mat-card>
  <mat-spinner *ngIf="isLoading"></mat-spinner>
  <form [formGroup]= 'loginForm' (ngSubmit)="onSubmit()" *ngIf="!isLoading">

      <mat-form-field *ngIf="mode==='signup'">
          <mat-label><mat-icon matSuffix>account_box</mat-icon> Username</mat-label>
          <input matInput type="text" placeholder="Username" formControlName='username'>
          <mat-error>Username already taken</mat-error>
        </mat-form-field>

      <mat-form-field *ngIf="mode==='signup' || mode==='edit'">
          <mat-label><mat-icon matSuffix>email</mat-icon> E-Mail</mat-label>
          <input matInput type="email" placeholder="E-Mail" formControlName='email'>
          <mat-error>Please enter a valid email.</mat-error>
        </mat-form-field>

        <mat-form-field *ngIf="mode==='login'">
          <mat-label><mat-icon matSuffix>account_box</mat-icon><mat-icon matSuffix>email</mat-icon> Username or E-Mail</mat-label>
          <input matInput type="text" placeholder="Username or E-Mail" formControlName='useremail'>
          <mat-error>Please enter a valid username or email.</mat-error>
        </mat-form-field>

        <mat-form-field *ngIf="mode==='signup' || mode==='login'">
          <mat-label><mat-icon matSuffix>vpn_key</mat-icon> Password</mat-label>
            <input matInput [type]="showPass ? 'text' : 'password'" placeholder="Password" formControlName='password'>
            <mat-icon matSuffix (click)="showPassword()" class="mat-icon-show-password">{{ showPass ? 'visibility_off' : 'visibility' }}</mat-icon>
            <mat-error>Please enter a password</mat-error>
        </mat-form-field>
        <hr>

        <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid">
          {{ mode==='signup' ? 'Confirm' : (mode==='edit' ? 'Signup' : 'Login') }}
        </button>
  </form>
</mat-card>
