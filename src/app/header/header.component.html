<mat-sidenav-container>
  <mat-sidenav #sidenav opened="false">
    <mat-nav-list>
      <a mat-list-item routerLink="/pages/home" (click)="sidenav.close()"><i class="material-icons">home</i>Home</a>
      <a mat-list-item routerLink="/list" (click)="sidenav.close()"><i class="material-icons">description</i>List</a>
      <a *ngIf='userIsAuthenticated' mat-list-item routerLink="/create" (click)="sidenav.close()"><i class="material-icons">face</i>New Post</a>
      <a *ngIf='!userIsAuthenticated' mat-list-item routerLink="/auth/login" (click)="sidenav.close()"><i class="material-icons">face</i>Login</a>
      <a *ngIf='!userIsAuthenticated' mat-list-item routerLink="/auth/signup" (click)="sidenav.close()"><i class="material-icons">person</i>Signup</a>
      <button *ngIf='userIsAuthenticated' mat-button (click)="sidenav.close();onLogout()"><i class="material-icons">person</i>Logout</button>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <div fxHide.gt-xs><button (click)="sidenav.toggle()"><i class="material-icons">menu</i></button></div>
      <a mat-button routerLink='/pages/home' routerLinkActive="mat-accent">Gljive Srbije</a>
      <span class="spacer"></span>
      <div fxFlex fxLayoutAlign="end" fxLayoutGap="10px" fxHide.xs>
        <a mat-button routerLink='/list' routerLinkActive="mat-accent">List</a>
        <a *ngIf='userIsAuthenticated' mat-button routerLink="/create" routerLinkActive="mat-accent">New Post</a>
        <a *ngIf='!userIsAuthenticated' mat-button routerLink="/auth/login" routerLinkActive="mat-accent">Login</a>
        <a *ngIf='!userIsAuthenticated' mat-button routerLink='/auth/signup' routerLinkActive="mat-accent">Signup</a>
        <button *ngIf='userIsAuthenticated' mat-button (click)="onLogout()">Logout</button>
      </div>
    </mat-toolbar>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
